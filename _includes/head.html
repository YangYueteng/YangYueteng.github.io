{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>


<!-- ========== 新增：强制锁定暗色模式 ========== -->
<script>
  // 页面加载立刻设置 dark 主题
  document.documentElement.setAttribute('data-theme', 'dark');
  // 拦截后续任何修改主题的操作（兜底保护）
  Object.defineProperty(document.documentElement, 'setAttribute', {
    value: function(name, val) {
      if(name === 'data-theme') val = 'dark';
      return Element.prototype.setAttribute.call(this, name, val);
    }
  })
</script>
<!-- ========================================== -->

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
